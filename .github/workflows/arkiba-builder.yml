name: Arkiba Builder

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_id:
        description: "Arkiba task ID"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  builder:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent:builder') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'VERDICT: REJECTED'))
    runs-on: ubuntu-latest
    steps:
      - name: Run Arkiba Builder
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_BUILDER_OAUTH_TOKEN }}
          prompt: |
            You are CLAUDE-1, Arkiba Builder.

            Read CLAUDE.md and .ai-session/agents/BUILDER.md first.
            Read the current GitHub issue/PR context and .ai-session/CURRENT_TASK.json.
            Read the matching task spec.

            For M000: perform audit/reproduction work only and do not intentionally change Arkiba product behavior.

            For implementation tasks:
            - work only on the assigned task;
            - test before/after where applicable;
            - push changes on a task branch;
            - create or update a PR;
            - write the Builder handoff artifact;
            - comment with objective evidence and REVIEW_READY.

            If this run was triggered by VERDICT: REJECTED, address every reproducible reviewer finding, update evidence, and request another review.

            Never use real patient data or expose secrets.
            Never claim mocks as production-complete.
          claude_args: |
            --max-turns 100
